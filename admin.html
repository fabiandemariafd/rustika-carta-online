(const p of items.filter(p=>(p.n+' '+p.c).toLowerCase().includes($('search').value.toLowerCase()))){const a=document.createElement('article'),f=document.createElement('form');for(const [key,label,type] of [['c','Categoría','text'],['n','Nombre','text'],['p','Precio','number'],['d','Descripción','textarea'],['position','Orden','number'],['active','Visible','checkbox']]){const l=document.createElement('label'),i=document.createElement(type==='textarea'?'textarea':'input');l.textContent=label+' ';if(type!=='textarea')i.type=type;i.name=key;if(type==='checkbox')i.checked=p[key];else i.value=p[key];if(['c','n','p','position'].includes(key))i.required=true;if(type==='number'){i.min=0;i.step=1}l.append(i);f.append(l)}const b=document.createElement('button');b.textContent='Guardar';f.append(b);f.onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f));v.p=Number(v.p);v.position=Number(v.position);v.active=f.elements.active.checked;try{const x=await api('/rest/v1/rustika_menu'+(p.id?'?id=eq.'+p.id:''),p.id?'PATCH':'POST',v);if(!x.length)throw Error('Sin permiso de escritura');await load();status('Guardado correctamente')}catch(e){status(e.message)}};a.append(f);root.append(a)}}$('form').onsubmit=async e=>{e.preventDefault();try{const x=await api('/auth/v1/token?grant_type=password','POST',{email:$('email').value,password:$('pass').value});if(x.user.id!=='d08e0b26-9993-4acc-b0a1-41bb45e7557f')throw Error('Usuario no autorizado');token=x.access_token;await load();$('login').hidden=true;$('panel').hidden=false;$('pass').value='';status('Sesión iniciada')}catch(e){token='';status(e.message)}};$('logout').onclick=async()=>{try{await api('/auth/v1/logout','POST')}catch(e){}token='';location.reload()};$('search').oninput=render;$('add').onclick=()=>{items.unshift({c:'Promociones',n:'',p:0,d:'',position:Math.max(0,...items.map(x=>x.position))+1,active:false});$('search').value='';render()};$('reset').onclick=async()=>{try{await api('/auth/v1/recover','POST',{email:$('email').value});status('Solicitud enviada. Revisá tu correo; el enlace depende de la configuración de Supabase.')}catch(e){status(e.message)}};</script></html>
